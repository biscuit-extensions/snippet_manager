[extension]
id = "snippet_manager"
name = "Snippet Manager"
version = "0.2.0"
description = "Custom code snippet repository, keyword prefix expansion engine, and tabstop placeholder navigator"
author = "tomlin7"
icon = "icon.png"

[dependencies]
python = []
tools = []

[contributes]
commands = [
    { id = "snippets.insert", title = "Snippets: Insert Snippet", category = "Snippets" },
    { id = "snippets.create", title = "Snippets: Create New Snippet", category = "Snippets" },
    { id = "snippets.list", title = "Snippets: List Available Snippets", category = "Snippets" },
    { id = "snippets.expand", title = "Snippets: Expand Snippet at Cursor", category = "Snippets" }
]
